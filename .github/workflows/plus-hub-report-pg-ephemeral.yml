name: PLUS HUB - Report PostgreSQL ephemeral integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/plus-hub-report-pg-ephemeral.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Reviewed 40-hex private PLUS-HUB commit SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-ph-report-pg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disposable-report-pg:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main' && github.repository == 'Sidious92/Public-PH'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture_report_test
          POSTGRES_PASSWORD: fixture_report_test_only
          POSTGRES_DB: plus_hub_report_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PLUS_HUB_EPHEMERAL_REPORT_PG: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: 'plus_hub_report_test'
      PGUSER: 'fixture_report_test'
      PGPASSWORD: 'fixture_report_test_only'
    steps:
      - name: Validate trusted SHA and private read-only checkout token
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'push' && '6736a67ab353d14462800a14f3957df86500af9b' || inputs.source_sha }}
          TOKEN_CONFIGURED: ${{ secrets.PUBLIC_PH_READ_TOKEN != '' }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'FAIL: invalid SHA'; exit 1; }
          [[ "$TOKEN_CONFIGURED" == 'true' ]] || { echo 'FAIL: missing private read token'; exit 1; }

      - name: Checkout reviewed private PLUS-HUB revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Sidious92/PLUS-HUB
          ref: ${{ github.event_name == 'push' && '6736a67ab353d14462800a14f3957df86500af9b' || inputs.source_sha }}
          token: ${{ secrets.PUBLIC_PH_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout: |
            apps
            modules
            packages
            tests
            tools
            db
          sparse-checkout-cone-mode: true
          path: private-src

      - name: Install Node 26 LTS without caching dependencies
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Verify commit and dedicated disposable DB test
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'push' && '6736a67ab353d14462800a14f3957df86500af9b' || inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "$SOURCE_SHA"
          test -f private-src/tests/report-postgres/handover-driver-integration.mjs
          test -f private-src/db/report/handover-schema-review.sql
          test -f private-src/apps/shift-report-bff/src/postgres-handover-runatomic.mjs
          echo 'Verified pinned revision and expected synthetic PostgreSQL test targets.'

      - name: Install exact npm 12.2.3 without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          if npm install -g npm@12.2.3 --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/npm12-install.log" 2>&1; then
            test "$(npm --version)" = '12.2.3'
            echo 'PASS: Node 26 with npm 12.2.3.'
          else
            echo 'FAIL: npm CLI setup, private logs withheld.'
            exit 1
          fi

      - name: Install from reviewed committed private lockfile only
        shell: bash
        run: |
          set -euo pipefail
          test -f private-src/package-lock.json
          git -C private-src ls-files --error-unmatch package-lock.json > /dev/null
          cp private-src/package-lock.json "$RUNNER_TEMP/committed-report-lock.json"
          if (cd private-src && npm ci --ignore-scripts --no-audit --no-fund) > "$RUNNER_TEMP/private-install.log" 2>&1; then
            cmp -s "$RUNNER_TEMP/committed-report-lock.json" private-src/package-lock.json
            echo 'PASS: PG16 test dependencies installed from committed immutable lockfile.'
          else
            echo 'FAIL: npm ci on committed lock, private logs withheld.'
            exit 1
          fi

      - name: Verify Node 26 active on the PostgreSQL test runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node.split(".")[0]')" = '26'
          echo 'PASS: Node 26 runner verified.'

      - name: Test Report BFF, real PostgreSQL CAS, receipt and two processes
        shell: bash
        run: |
          set -euo pipefail
          if (cd private-src && node tests/report-postgres/handover-driver-integration.mjs) > "$RUNNER_TEMP/private-report-pg.log" 2>&1; then
            echo 'PASS: dedicated synthetic Report PostgreSQL 16 integration.'
          else
            echo 'FAIL: dedicated synthetic Report PostgreSQL integration; raw logs withheld.'
            exit 1
          fi

      - name: Check private source files remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C private-src status --porcelain --untracked-files=no)"

# The job uses a GitHub-hosted isolated PostgreSQL SERVICE, never a corporate VM.
# No artifacts, uploads, production credentials or raw private source logs.
# Manual reviewed source SHA ONLY; risk of running malicious source in CI remains.
# Node 26/npm 12 must install from the committed private npm lockfile.
