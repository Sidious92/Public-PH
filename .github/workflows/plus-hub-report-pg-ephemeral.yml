name: PLUS HUB - Report PostgreSQL ephemeral integration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Reviewed 40-hex private PLUS-HUB commit SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-ph-report-pg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disposable-report-pg:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Sidious92/Public-PH'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture_report_test
          POSTGRES_PASSWORD: fixture_report_test_only
          POSTGRES_DB: plus_hub_report_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PLUS_HUB_EPHEMERAL_REPORT_PG: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: 'plus_hub_report_test'
      PGUSER: 'fixture_report_test'
      PGPASSWORD: 'fixture_report_test_only'
    steps:
      - name: Validate trusted SHA and private read-only checkout token
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TOKEN_CONFIGURED: ${{ secrets.PUBLIC_PH_READ_TOKEN != '' }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'FAIL: invalid SHA'; exit 1; }
          [[ "$TOKEN_CONFIGURED" == 'true' ]] || { echo 'FAIL: missing private read token'; exit 1; }

      - name: Checkout reviewed private PLUS-HUB revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Sidious92/PLUS-HUB
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.PUBLIC_PH_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout: |
            apps
            modules
            packages
            tests
            tools
            db
          sparse-checkout-cone-mode: true
          path: private-src

      - name: Install Node 26 LTS without caching dependencies
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Verify commit and dedicated disposable DB test
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "$SOURCE_SHA"
          test -f private-src/tests/report-postgres/handover-driver-integration.mjs
          test -f private-src/db/report/handover-schema-review.sql
          test -f private-src/apps/shift-report-bff/src/postgres-handover-runatomic.mjs
          echo 'Verified pinned revision and expected synthetic PostgreSQL test targets.'

      - name: Install exact npm 12.2.3 without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          if npm install -g npm@12.2.3 --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/npm12-install.log" 2>&1; then
            test "$(npm --version)" = '12.2.3'
            echo 'PASS: Node 26 with npm 12.2.3.'
          else
            echo 'FAIL: npm CLI setup, private logs withheld.'
            exit 1
          fi

      - name: Install from reviewed committed private lockfile only
        shell: bash
        run: |
          set -euo pipefail
          test -f private-src/package-lock.json
          git -C private-src ls-files --error-unmatch package-lock.json > /dev/null
          cp private-src/package-lock.json "$RUNNER_TEMP/committed-report-lock.json"
          if (cd private-src && npm ci --ignore-scripts --no-audit --no-fund) > "$RUNNER_TEMP/private-install.log" 2>&1; then
            cmp -s "$RUNNER_TEMP/committed-report-lock.json" private-src/package-lock.json
            echo 'PASS: PG16 test dependencies installed from committed immutable lockfile.'
          else
            echo 'FAIL: npm ci on committed lock, private logs withheld.'
            exit 1
          fi

      - name: Verify Node 26 active on the PostgreSQL test runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node.split(".")[0]')" = '26'
          echo 'PASS: Node 26 runner verified.'

      - name: Test Report BFF, real PostgreSQL CAS, receipt and two processes
        shell: bash
        run: |
          set -euo pipefail
          if (cd private-src && node tests/report-postgres/handover-driver-integration.mjs) > "$RUNNER_TEMP/private-report-pg.log" 2>&1; then
            echo 'PASS: dedicated synthetic Report PostgreSQL 16 integration.'
          else
            echo 'FAIL: dedicated synthetic Report PostgreSQL integration; raw logs withheld.'
            exit 1
          fi

      - name: Verify additive local migrations and persistent Night GR workflows
        shell: bash
        run: |
          set -euo pipefail
          result=0
          (cd private-src && node tests/report-postgres/local-server-persistence.mjs) > "$RUNNER_TEMP/local-server-pg.log" 2>&1 || result=$?
          grep -E '^LOCAL_PG_GATE (provision|upgrade-preserves-data|migrations|least-privilege|write-disconnect|durable-readback|night-gr-persistence|handover-attribution|pdf-archive)$' "$RUNNER_TEMP/local-server-pg.log" || true
          test "$result" = 0 || { echo 'FAIL: local restricted PostgreSQL gate; raw logs withheld.'; exit 1; }
          echo 'PASS: local restricted PostgreSQL migration and Night GR persistence.'

      - name: Verify native managed cluster lifecycle in isolated PG16 image
        shell: bash
        run: |
          set -euo pipefail
          # Reuse the already-present service image, not apt or a second provider.
          image_id="$(docker image inspect --format '{{.Id}}' postgres:16)"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          node_bin="$(readlink -f "$(command -v node)")"
          src="$(realpath private-src)"
          test -x "$node_bin"
          # Carry the exact setup-node runtime and its own ELF loader/libraries.
          # Do not inject host libraries into PostgreSQL or its child processes.
          runtime="$(mktemp -d "$RUNNER_TEMP/ph-node-runtime.XXXXXX")"
          trap 'rm -rf -- "$runtime"' EXIT
          chmod 755 "$runtime"
          ldd "$node_bin" > "$RUNNER_TEMP/node-linkage.log"
          if grep -q 'not found' "$RUNNER_TEMP/node-linkage.log"; then
            echo 'FAIL: Node runner has unresolved library dependencies.'
            exit 1
          fi
          loader="$(awk '$1 ~ /^\// {print $1; exit}' "$RUNNER_TEMP/node-linkage.log")"
          test -n "$loader" && test -f "$loader"
          cp -L -- "$loader" "$runtime/loader"
          cp -L -- "$node_bin" "$runtime/node"
          while IFS=$'\t' read -r name lib; do
            [[ "$name" =~ ^[a-zA-Z0-9_.+-]+$ ]] && [[ "$lib" == /* ]] && test -f "$lib"
            cp -L -- "$lib" "$runtime/$name"
          done < <(awk '$2=="=>" && $3 ~ /^\// {print $1 "\t" $3}' "$RUNNER_TEMP/node-linkage.log")
          chmod -R a+rX "$runtime"
          test "$("$runtime/loader" --library-path "$runtime" "$runtime/node" -p 'process.versions.node.split(".")[0]')" = 26
          echo 'PASS: self-contained Node runtime linkage verified.'
          result=0
          docker run --rm --pull never --network none --user postgres \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$src,target=/private-src,readonly" \
            --mount "type=bind,source=$runtime,target=/node-runtime,readonly" \
            --workdir /private-src \
            --env PLUS_HUB_NATIVE_PG_TEST=yes \
            --env PLUS_HUB_PG_BIN=/usr/lib/postgresql/16/bin \
            --entrypoint /bin/sh "$image_id" -ec '
              test "$(id -u)" != 0
              echo "LOCAL_PG_GATE container-user"
              test -r /private-src/tests/local-server/native-pg-lifecycle.mjs
              test -r /private-src/node_modules/pg/package.json
              echo "LOCAL_PG_GATE container-source"
              test "$(/node-runtime/loader --library-path /node-runtime /node-runtime/node -p "process.versions.node.split(String.fromCharCode(46))[0]")" = 26
              echo "LOCAL_PG_GATE container-node"
              "$PLUS_HUB_PG_BIN/initdb" --version >/dev/null
              "$PLUS_HUB_PG_BIN/pg_ctl" --version >/dev/null
              echo "LOCAL_PG_GATE container-postgres"
              exec /node-runtime/loader --library-path /node-runtime /node-runtime/node tests/local-server/native-pg-lifecycle.mjs
            ' > "$RUNNER_TEMP/native-pg-test.log" 2>&1 || result=$?
          grep -E '^LOCAL_PG_GATE (container-user|container-source|container-node|container-postgres|native-provision|native-core-provision|native-core-accounts|native-stop|native-pdf-restart|native-restart)$' "$RUNNER_TEMP/native-pg-test.log" || true
          # Only predeclared synthetic failure codes. Never expose private paths or data.
          grep -Eo 'LOCAL_PG16_BINARIES_MISSING|LOCAL_PG_BINARY_UNAVAILABLE|LOCAL_PG_TIMEOUT|LOCAL_PG_INIT_FAILED|LOCAL_PG_START_FAILED|LOCAL_PG_STOP_FAILED|LOCAL_PG_RUNTIME_CHECK_FAILED|LOCAL_CLUSTER_IDENTITY_MISMATCH|LOCAL_PG_PORT_OCCUPIED|LOCAL_STATE_REDIRECTED|LOCAL_UNMANAGED_STATE_PRESENT|LOCAL_PROVISION_LOCKED' "$RUNNER_TEMP/native-pg-test.log" | sort -u | head -12 || true
          if [ "$result" != 0 ]; then
            echo "Native gate exit code: $result"
            for reason in glibc library permission module assertion; do
              case "$reason" in
                glibc) pattern='GLIBC_[0-9].*not found' ;;
                library) pattern='error while loading shared libraries' ;;
                permission) pattern='Permission denied|EACCES' ;;
                module) pattern='ERR_MODULE_NOT_FOUND|MODULE_NOT_FOUND' ;;
                assertion) pattern='ERR_ASSERTION|AssertionError' ;;
              esac
              if grep -Eq "$pattern" "$RUNNER_TEMP/native-pg-test.log"; then echo "Native diagnostic: $reason"; fi
            done
            echo 'FAIL: native managed PostgreSQL lifecycle; raw logs withheld.'
            exit 1
          fi
          echo 'PASS: native PostgreSQL provisioning and actual restart.'

      - name: Verify independent Core IAM database and local session lifecycle
        shell: bash
        run: |
          set -euo pipefail
          result=0
          (cd private-src && node tests/report-postgres/local-core-iam.mjs) > "$RUNNER_TEMP/local-core-iam.log" 2>&1 || result=$?
          grep -E '^LOCAL_IAM_GATE (separate-core|least-privilege|login-and-scope|https-shell-login|https-module-sso|module-ipc-boundary|session-family|reconnect-revocation|logout-idle-absolute)$' "$RUNNER_TEMP/local-core-iam.log" || true
          if [ "$result" != 0 ]; then
            grep -E '^LOCAL_IAM_DIAGNOSTIC (initial|check-db|create-roles|create-db|schema-rights|apply-ddl|grant-runtime|fixtures|password-kdf|insert-fixture|least-privilege|login|https-shell|session-family|reconnect-revocation|expiry) ([0-9A-Z]{5}|ERR_[A-Z0-9_]{3,60}|LOCAL_[A-Z0-9_]{3,60}|CORE_[A-Z0-9_]{3,60}|UNAUTHENTICATED|CSRF_FORBIDDEN|UNKNOWN)$' "$RUNNER_TEMP/local-core-iam.log" || true
            grep -Eo 'ERR_ASSERTION|UNAUTHENTICATED|CSRF_FORBIDDEN|CORE_ACCOUNT_REVISION_REQUIRED|CORE_SESSION_UPDATE_FAILED|LOCAL_IAM_PORT_REQUIRED|LOCAL_PASSWORD_INVALID|LOCAL_LOGIN_INVALID|LOCAL_LOGIN_BUSY|42501|23514' "$RUNNER_TEMP/local-core-iam.log" | sort -u | head -12 || true
            echo 'FAIL: independent Core IAM session lifecycle; raw logs withheld.'
            exit 1
          fi
          echo 'PASS: independent Core IAM database and local session lifecycle.'

      - name: Check private source files remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C private-src status --porcelain --untracked-files=no)"

# The job uses a GitHub-hosted isolated PostgreSQL SERVICE, never a corporate VM.
# No artifacts, uploads, production credentials or raw private source logs.
# Manual reviewed source SHA ONLY; risk of running malicious source in CI remains.
# Node 26/npm 12 must install from the committed private npm lockfile.
